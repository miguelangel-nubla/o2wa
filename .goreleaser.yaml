# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # Go 1.26 dropped windows/arm (32-bit)
      - goos: windows
        goarch: arm

# One multi-platform buildx build that pushes a single index for all tags, with its SBOM and provenance
# attestations (dockers + docker_manifests stitched per-arch images together and break on attestations).
dockers_v2:
  - images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - entrypoint.sh
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.url": "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      "org.opencontainers.image.source": "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    annotations:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    flags:
      - "--pull"

archives:
  - files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - config.example.yaml
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
